name: Single File APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create All Project Files Automatically
        run: |
          mkdir -p src/main/java/com/example/usbtether
          mkdir -p src/main/res/xml
          mkdir -p src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UsbTether"
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2'
          }
          android {
              namespace 'com.example.usbtether'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.usbtether"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > src/main/res/drawable/ic_usb.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M15,7v4h1v2h-3V5h2l-3,-4 -3,4h2v8H8v-2.07c0.7,-0.37 1.2,-1.08 1.2,-1.93 0,-1.21 -0.99,-2.2 -2.2,-2.2 -1.21,0 -2.2,0.99 -2.2,2.2 0,0.85 0.5,1.56 1.2,1.93V13c0,1.11 0.89,2 2,2h3v3.05c-0.71,0.37 -1.2,1.1 -1.2,1.95 0,1.22 0.99,2.2 2.2,2.2 1.21,0 2.2,-0.98 2.2,-2.2 0,-0.85 -0.49,-1.58 -1.2,-1.95V15h3c1.11,0 2,-0.89 2,-2v-2h1V7h-4z"/>
          </vector>
          EOF

          cat << 'EOF' > src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#2962FF"
                  android:pathData="M12,12m-11,0a11,11 0,1 1,22 0a11,11 0,1 1,-22 0"/>
              <group
                  android:scaleX="0.65"
                  android:scaleY="0.65"
                  android:pivotX="12"
                  android:pivotY="12">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M15,7v4h1v2h-3V5h2l-3,-4 -3,4h2v8H8v-2.07c0.7,-0.37 1.2,-1.08 1.2,-1.93 0,-1.21 -0.99,-2.2 -2.2,-2.2 -1.21,0 -2.2,0.99 -2.2,2.2 0,0.85 0.5,1.56 1.2,1.93V13c0,1.11 0.89,2 2,2h3v3.05c-0.71,0.37 -1.2,1.1 -1.2,1.95 0,1.22 0.99,2.2 2.2,2.2 1.21,0 2.2,-0.98 2.2,-2.2 0,-0.85 -0.49,-1.58 -1.2,-1.95V15h3c1.11,0 2,-0.89 2,-2v-2h1V7h-4z"/>
              </group>
          </vector>
          EOF

          cat << 'EOF' > src/main/res/xml/accessibility_service_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:label="USB Tether"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".UsbTileService"
                      android:label="USB Tethering"
                      android:icon="@drawable/ic_usb"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>

                  <service
                      android:name=".TetherAutoClickService"
                      android:label="USB Tether Auto Click"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/main/java/com/example/usbtether/MainActivity.java
          package com.example.usbtether;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private TextView statusText;
              private TextView accessText;
              private Button toggleBtn;
              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setBackgroundColor(Color.parseColor("#131722"));
                  int pad = (int) (24 * getResources().getDisplayMetrics().density);
                  layout.setPadding(pad, pad, pad, pad);

                  TextView title = new TextView(this);
                  title.setText("USB Tethering Control");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  statusText = new TextView(this);
                  statusText.setTextSize(16);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, pad / 2, 0, pad);
                  layout.addView(statusText);

                  toggleBtn = new Button(this);
                  toggleBtn.setTextColor(Color.WHITE);
                  toggleBtn.setTextSize(16);
                  int btnSize = (int) (150 * getResources().getDisplayMetrics().density);
                  LinearLayout.LayoutParams btnParams = new LinearLayout.LayoutParams(btnSize, btnSize);
                  btnParams.bottomMargin = pad;
                  toggleBtn.setLayoutParams(btnParams);
                  toggleBtn.setOnClickListener(v -> handleToggle());
                  layout.addView(toggleBtn);

                  accessText = new TextView(this);
                  accessText.setTextSize(14);
                  accessText.setGravity(Gravity.CENTER);
                  accessText.setPadding(0, 0, 0, pad / 2);
                  layout.addView(accessText);

                  Button accBtn = new Button(this);
                  accBtn.setText("Accessibility सेटिंग खोलें");
                  accBtn.setTextColor(Color.WHITE);
                  GradientDrawable accBg = new GradientDrawable();
                  accBg.setColor(Color.parseColor("#1E222D"));
                  accBg.setCornerRadius(24f);
                  accBg.setStroke(2, Color.parseColor("#363C4E"));
                  accBtn.setBackground(accBg);
                  accBtn.setPadding(pad, pad / 2, pad, pad / 2);
                  accBtn.setOnClickListener(v -> {
                      Intent intent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      startActivity(intent);
                  });
                  layout.addView(accBtn);

                  setContentView(layout);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  updateUI();
                  handler.postDelayed(this::updateUI, 800);
              }

              private void updateUI() {
                  boolean active = UsbTileService.isUsbTetheringActive();
                  boolean accEnabled = UsbTileService.isAccessibilityEnabled(this);

                  statusText.setText(active ? "Status: ON (चालू है)" : "Status: OFF (बंद है)");
                  statusText.setTextColor(active ? Color.parseColor("#00E676") : Color.parseColor("#9BA3B0"));

                  GradientDrawable circle = new GradientDrawable();
                  circle.setShape(GradientDrawable.OVAL);
                  if (active) {
                      circle.setColor(Color.parseColor("#2962FF"));
                      circle.setStroke(6, Color.parseColor("#82B1FF"));
                      toggleBtn.setText("USB Tether\nON");
                  } else {
                      circle.setColor(Color.parseColor("#1E222D"));
                      circle.setStroke(6, Color.parseColor("#363C4E"));
                      toggleBtn.setText("USB Tether\nOFF");
                  }
                  toggleBtn.setBackground(circle);

                  if (accEnabled) {
                      accessText.setText("Auto-Click Permission: Active");
                      accessText.setTextColor(Color.parseColor("#00E676"));
                  } else {
                      accessText.setText("Auto-Click Permission: OFF (इसे ऑन करें)");
                      accessText.setTextColor(Color.parseColor("#FF5252"));
                  }
              }

              private void handleToggle() {
                  if (!UsbTileService.isAccessibilityEnabled(this)) {
                      Toast.makeText(this, "पहले Downloaded apps में जाकर USB Tether Auto Click ऑन करें", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  TetherAutoClickService.triggerAutoClick();
                  Intent intent = new Intent();
                  intent.setComponent(new ComponentName(
                          "com.android.settings",
                          "com.android.settings.TetherSettings"
                  ));
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                  startActivity(intent);
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/example/usbtether/UsbTileService.java
          package com.example.usbtether;

          import android.app.PendingIntent;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;
          import android.widget.Toast;
          import java.net.NetworkInterface;
          import java.util.Enumeration;

          public class UsbTileService extends TileService {
              private final Handler handler = new Handler(Looper.getMainLooper());

              public static boolean isUsbTetheringActive() {
                  try {
                      Enumeration<NetworkInterface> interfaces = NetworkInterface.getNetworkInterfaces();
                      if (interfaces == null) return false;
                      while (interfaces.hasMoreElements()) {
                          NetworkInterface intf = interfaces.nextElement();
                          String name = intf.getName().toLowerCase();
                          if ((name.contains("rndis") || name.contains("usb") || name.contains("ncm")) && intf.isUp()) {
                              return true;
                          }
                      }
                  } catch (Exception ignored) {}
                  return false;
              }

              public static boolean isAccessibilityEnabled(Context context) {
                  String enabled = Settings.Secure.getString(
                          context.getContentResolver(),
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  );
                  if (enabled == null) return false;
                  return enabled.contains(context.getPackageName() + "/" + TetherAutoClickService.class.getName())
                          || enabled.contains(context.getPackageName() + "/.TetherAutoClickService");
              }

              public void syncTileState() {
                  Tile tile = getQsTile();
                  if (tile != null) {
                      boolean active = isUsbTetheringActive();
                      tile.setState(active ? Tile.STATE_ACTIVE : Tile.STATE_INACTIVE);
                      tile.updateTile();
                  }
              }

              @Override
              public void onStartListening() {
                  super.onStartListening();
                  syncTileState();
                  handler.postDelayed(this::syncTileState, 500);
                  handler.postDelayed(this::syncTileState, 1500);
              }

              @Override
              @SuppressWarnings("deprecation")
              public void onClick() {
                  super.onClick();

                  if (!isAccessibilityEnabled(this)) {
                      syncTileState();
                      Toast.makeText(this, "Downloaded apps में जाकर USB Tether Auto Click ऑन करें", Toast.LENGTH_LONG).show();
                      Intent accIntent = new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                      accIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      launchIntent(accIntent);
                      return;
                  }

                  TetherAutoClickService.triggerAutoClick();

                  Intent intent = new Intent();
                  intent.setComponent(new ComponentName(
                          "com.android.settings",
                          "com.android.settings.TetherSettings"
                  ));
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK | Intent.FLAG_ACTIVITY_NO_ANIMATION);
                  launchIntent(intent);

                  handler.postDelayed(this::syncTileState, 800);
                  handler.postDelayed(this::syncTileState, 1600);
                  handler.postDelayed(this::syncTileState, 2500);
              }

              @SuppressWarnings("deprecation")
              private void launchIntent(Intent intent) {
                  if (Build.VERSION.SDK_INT >= 34) {
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                              this, 0, intent, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT
                      );
                      startActivityAndCollapse(pendingIntent);
                  } else {
                      startActivityAndCollapse(intent);
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/example/usbtether/TetherAutoClickService.java
          package com.example.usbtether;

          import android.accessibilityservice.AccessibilityService;
          import android.content.ComponentName;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.quicksettings.TileService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.Toast;
          import java.util.List;

          public class TetherAutoClickService extends AccessibilityService {
              private static boolean shouldClickUsbTether = false;
              private static long requestTime = 0;
              private final Handler handler = new Handler(Looper.getMainLooper());

              public static void triggerAutoClick() {
                  shouldClickUsbTether = true;
                  requestTime = System.currentTimeMillis();
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (!shouldClickUsbTether) return;
                  attemptClick();
              }

              private void attemptClick() {
                  if (!shouldClickUsbTether) return;
                  if (System.currentTimeMillis() - requestTime > 4000) {
                      shouldClickUsbTether = false;
                      return;
                  }

                  AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                  if (rootNode == null) {
                      handler.postDelayed(this::attemptClick, 150);
                      return;
                  }

                  List<AccessibilityNodeInfo> nodes = rootNode.findAccessibilityNodeInfosByText("USB tethering");
                  if (nodes != null && !nodes.isEmpty()) {
                      for (AccessibilityNodeInfo node : nodes) {
                          AccessibilityNodeInfo parent = node;
                          while (parent != null && !parent.isClickable()) {
                              parent = parent.getParent();
                          }
                          if (parent != null) {
                              shouldClickUsbTether = false;
                              if (parent.isEnabled()) {
                                  parent.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                              } else {
                                  Toast.makeText(this, "USB केबल कनेक्ट नहीं है", Toast.LENGTH_SHORT).show();
                              }
                              handler.postDelayed(() -> {
                                  performGlobalAction(GLOBAL_ACTION_BACK);
                                  requestTileSync();
                              }, 250);
                              handler.postDelayed(this::requestTileSync, 900);
                              return;
                          }
                      }
                  }

                  handler.postDelayed(this::attemptClick, 150);
              }

              private void requestTileSync() {
                  try {
                      TileService.requestListeningState(
                              this,
                              new ComponentName(this, UsbTileService.class)
                      );
                  } catch (Exception ignored) {}
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: USB-Tether-APK
          path: build/outputs/apk/debug/*.apk
