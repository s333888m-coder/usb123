name: Single File APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create All Project Files Automatically
        run: |
          mkdir -p src/main/java/com/example/usbtether
          mkdir -p src/main/res/xml
          mkdir -p src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UsbTether"
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2'
          }
          android {
              namespace 'com.example.usbtether'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.usbtether"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > src/main/res/drawable/ic_usb.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M15,7v4h1v2h-3V5h2l-3,-4 -3,4h2v8H8v-2.07c0.7,-0.37 1.2,-1.08 1.2,-1.93 0,-1.21 -0.99,-2.2 -2.2,-2.2 -1.21,0 -2.2,0.99 -2.2,2.2 0,0.85 0.5,1.56 1.2,1.93V13c0,1.11 0.89,2 2,2h3v3.05c-0.71,0.37 -1.2,1.1 -1.2,1.95 0,1.22 0.99,2.2 2.2,2.2 1.21,0 2.2,-0.98 2.2,-2.2 0,-0.85 -0.49,-1.58 -1.2,-1.95V15h3c1.11,0 2,-0.89 2,-2v-2h1V7h-4z"/>
          </vector>
          EOF

          cat << 'EOF' > src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="USB Tether Toggle"
                  android:icon="@drawable/ic_usb">
                  <service
                      android:name=".UsbTileService"
                      android:label="USB Tethering"
                      android:icon="@drawable/ic_usb"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".TetherAutoClickService"
                      android:label="USB Tether Auto Click"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/main/java/com/example/usbtether/UsbTileService.java
          package com.example.usbtether;

          import android.app.PendingIntent;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.os.Build;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;

          public class UsbTileService extends TileService {
              @Override
              @SuppressWarnings("deprecation")
              public void onClick() {
                  super.onClick();
                  TetherAutoClickService.shouldClickUsbTether = true;

                  Intent intent = new Intent();
                  intent.setComponent(new ComponentName(
                          "com.android.settings",
                          "com.android.settings.TetherSettings"
                  ));
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);

                  if (Build.VERSION.SDK_INT >= 34) {
                      PendingIntent pendingIntent = PendingIntent.getActivity(
                              this, 0, intent, PendingIntent.FLAG_IMMUTABLE
                      );
                      startActivityAndCollapse(pendingIntent);
                  } else {
                      startActivityAndCollapse(intent);
                  }

                  Tile tile = getQsTile();
                  if (tile != null) {
                      tile.setState(tile.getState() == Tile.STATE_ACTIVE ? Tile.STATE_INACTIVE : Tile.STATE_ACTIVE);
                      tile.updateTile();
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/example/usbtether/TetherAutoClickService.java
          package com.example.usbtether;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.List;

          public class TetherAutoClickService extends AccessibilityService {
              public static boolean shouldClickUsbTether = false;

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (!shouldClickUsbTether) return;

                  AccessibilityNodeInfo rootNode = getRootInActiveWindow();
                  if (rootNode == null) return;

                  List<AccessibilityNodeInfo> nodes = rootNode.findAccessibilityNodeInfosByText("USB tethering");
                  if (nodes != null) {
                      for (AccessibilityNodeInfo node : nodes) {
                          AccessibilityNodeInfo parent = node;
                          while (parent != null && !parent.isClickable()) {
                              parent = parent.getParent();
                          }
                          if (parent != null) {
                              parent.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                              shouldClickUsbTether = false;
                              performGlobalAction(GLOBAL_ACTION_BACK);
                              break;
                          }
                      }
                  }
              }

              @Override
              public void onInterrupt() {}
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: USB-Tether-APK
          path: build/outputs/apk/debug/*.apk
